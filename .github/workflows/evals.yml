name: Nightly evals

# Model-based agent-loop evals (sandbox fixtures only — no private repos).
# Requires the ANTHROPIC_API_KEY secret; the job skips gracefully without it.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      trials:
        description: "Trials per scenario (pass = all trials pass)"
        default: "1"

jobs:
  agent-loop-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for API key
        id: key
        run: |
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY not configured — skipping model-based evals"
          fi
      - name: Install Claude Code
        if: steps.key.outputs.present == 'true'
        run: npm install -g @anthropic-ai/claude-code
      - name: Run sandbox eval scenarios
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: sh evals/agent-loop/run-eval.sh --fixtures sandbox --trials "${{ github.event.inputs.trials || '1' }}"
      # transcripts land in gitignored runs/ and die with the runner — upload
      # them so a red nightly is debuggable without a local rerun
      - name: Upload eval transcripts
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agent-loop-eval-runs
          path: evals/agent-loop/runs/
          if-no-files-found: ignore
          retention-days: 14
