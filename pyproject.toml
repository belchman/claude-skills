[tool.mutmut]
paths_to_mutate = ["plugins/agentic-engineering/skills/crap/crap.py"]
tests_dir = ["tests"]

[tool.pytest.ini_options]
# Pin collection to tests/ — mutants/ (mutmut output, gitignored) contains a
# shadow tests/ package that otherwise collides at import time.
testpaths = ["tests"]
norecursedirs = ["mutants"]
